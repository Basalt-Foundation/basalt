services:
  # ─── Cloudflare Tunnel ─────────────────────────────────────────────
  # Exposes the testnet RPC via Cloudflare Tunnel — no open ports needed.
  # Set CLOUDFLARE_TUNNEL_TOKEN in .env (get it from Cloudflare Zero Trust dashboard).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: basalt-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - basalt-testnet
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started

  # ─── Block Explorer (Blazor WASM — static files via nginx) ────────
  explorer:
    build:
      context: ../..
      dockerfile: deploy/testnet/Dockerfile.explorer
    container_name: basalt-explorer
    networks:
      - basalt-testnet
    restart: unless-stopped

  # ─── Website (Next.js static export via nginx) ───────────────────
  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    container_name: basalt-website
    networks:
      - basalt-testnet
    restart: unless-stopped

  # ─── Caldera DEX (Next.js standalone) ─────────────────────────────
  #
  # Lives in its own repository, so the build context points outside this one. Caddy has routed
  # caldera.basalt.foundation here since the routing commit, with nothing behind it until now: the
  # hostname answered 502 rather than failing to resolve, which reads as an outage rather than as
  # something never deployed.
  #
  # Both build arguments are NEXT_PUBLIC_, so they are fixed when the image is built and cannot be
  # changed by restarting the container. The API URL is a container name on purpose: the browser never
  # uses it, because every REST call goes through the Next rewrite at /api/node, which runs server side.
  # The WebSocket URL is the public one, because that one the browser does dial itself.
  caldera:
    build:
      context: ${CALDERA_PATH:-../../../caldera}
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_BASALT_WS_URL: wss://testnet.basalt.foundation
        NEXT_PUBLIC_BASALT_API_URL: http://rpc-0:5000
    container_name: basalt-caldera
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      rpc-0:
        condition: service_healthy

  # ─── Reverse Proxy (routing, CORS, security headers) ───────────────
  caddy:
    image: caddy:2-alpine
    container_name: basalt-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - basalt-testnet
    restart: unless-stopped
    depends_on:
      rpc-0:
        condition: service_healthy
      explorer:
        condition: service_started
      website:
        condition: service_started
      caldera:
        condition: service_started

  # ─── Validator 0 (Primary RPC endpoint) ────────────────────────────
  validator-0:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: basalt-validator-0
    environment:
      - BASALT_VALIDATOR_INDEX=0
      - BASALT_VALIDATOR_ADDRESS=${VALIDATOR_0_ADDRESS}
      - BASALT_VALIDATOR_KEY=${VALIDATOR_0_KEY}
      - BASALT_FAUCET_KEY=${BASALT_FAUCET_KEY}
      - BASALT_GENESIS_VALIDATORS=${BASALT_GENESIS_VALIDATORS}
      - BASALT_NETWORK=basalt-testnet
      - BASALT_CHAIN_ID=4242
      - ASPNETCORE_URLS=http://+:5000
      - BASALT_PEERS=validator-1:30303,validator-2:30303,validator-3:30303
      - BASALT_DATA_DIR=/data/basalt
    volumes:
      - validator-0-data:/data/basalt
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/v1/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Validator 1 ───────────────────────────────────────────────────
  validator-1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: basalt-validator-1
    environment:
      - BASALT_VALIDATOR_INDEX=1
      - BASALT_VALIDATOR_ADDRESS=${VALIDATOR_1_ADDRESS}
      - BASALT_VALIDATOR_KEY=${VALIDATOR_1_KEY}
      - BASALT_FAUCET_KEY=${BASALT_FAUCET_KEY}
      - BASALT_GENESIS_VALIDATORS=${BASALT_GENESIS_VALIDATORS}
      - BASALT_NETWORK=basalt-testnet
      - BASALT_CHAIN_ID=4242
      - ASPNETCORE_URLS=http://+:5000
      - BASALT_PEERS=validator-0:30303,validator-2:30303,validator-3:30303
      - BASALT_DATA_DIR=/data/basalt
    volumes:
      - validator-1-data:/data/basalt
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ─── Validator 2 ───────────────────────────────────────────────────
  validator-2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: basalt-validator-2
    environment:
      - BASALT_VALIDATOR_INDEX=2
      - BASALT_VALIDATOR_ADDRESS=${VALIDATOR_2_ADDRESS}
      - BASALT_VALIDATOR_KEY=${VALIDATOR_2_KEY}
      - BASALT_FAUCET_KEY=${BASALT_FAUCET_KEY}
      - BASALT_GENESIS_VALIDATORS=${BASALT_GENESIS_VALIDATORS}
      - BASALT_NETWORK=basalt-testnet
      - BASALT_CHAIN_ID=4242
      - ASPNETCORE_URLS=http://+:5000
      - BASALT_PEERS=validator-0:30303,validator-1:30303,validator-3:30303
      - BASALT_DATA_DIR=/data/basalt
    volumes:
      - validator-2-data:/data/basalt
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ─── Validator 3 ───────────────────────────────────────────────────
  validator-3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: basalt-validator-3
    environment:
      - BASALT_VALIDATOR_INDEX=3
      - BASALT_VALIDATOR_ADDRESS=${VALIDATOR_3_ADDRESS}
      - BASALT_VALIDATOR_KEY=${VALIDATOR_3_KEY}
      - BASALT_FAUCET_KEY=${BASALT_FAUCET_KEY}
      - BASALT_GENESIS_VALIDATORS=${BASALT_GENESIS_VALIDATORS}
      - BASALT_NETWORK=basalt-testnet
      - BASALT_CHAIN_ID=4242
      - ASPNETCORE_URLS=http://+:5000
      - BASALT_PEERS=validator-0:30303,validator-1:30303,validator-2:30303
      - BASALT_DATA_DIR=/data/basalt
    volumes:
      - validator-3-data:/data/basalt
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ─── RPC Node 0 (public API, no consensus) ────────────────────────
  rpc-0:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: basalt-rpc-0
    environment:
      - BASALT_MODE=rpc
      - BASALT_SYNC_SOURCE=http://validator-0:5000
      # Required even here: the public-network guard is in the common startup path, and this node serves
      # the faucet endpoint that is how testnet users actually get funds.
      - BASALT_FAUCET_KEY=${BASALT_FAUCET_KEY}
      - BASALT_GENESIS_VALIDATORS=${BASALT_GENESIS_VALIDATORS}
      - BASALT_NETWORK=basalt-testnet
      - BASALT_CHAIN_ID=4242
      - ASPNETCORE_URLS=http://+:5000
      - BASALT_DATA_DIR=/data/basalt
    volumes:
      - rpc-0-data:/data/basalt
    networks:
      - basalt-testnet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      validator-0:
        condition: service_healthy

volumes:
  validator-0-data:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  rpc-0-data:

networks:
  basalt-testnet:
    external: true
